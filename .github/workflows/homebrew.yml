name: Homebrew
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  homebrew:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: git-workspace
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
